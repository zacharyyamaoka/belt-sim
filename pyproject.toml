[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bam-belt-sim"
version = "0.1.0"
description = "Headless, fast 2D sim of a conveyor line with N pick arms: belt speed control (constant -> rush-when-idle -> deadline-aware -> segmented belts, with recirculation) and pick scheduling (FIFO -> shortest-cycle -> value-rate -> last-chance -> lookahead), scored in successful picks/min and value/min against an LP upper bound. matplotlib 2D and Viser 3D replays."
readme = "README.md"
requires-python = ">=3.11"
# WHY numpy only at runtime: the sim is the fast headless rung; it must run in a ladder sweep of thousands of
# episodes. The LP bound (scipy/HiGHS) and the two viewers are extras so the core stays importable anywhere.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
bound = ["scipy>=1.12"]
viz = ["matplotlib>=3.8", "imageio[ffmpeg]>=2.34"]
# WHY the house viewer, not raw viser: no logo, Fusion ViewCube, asserted port and Playback come with it.
viser = ["viser-3d-viewer"]
test = ["pytest>=8", "scipy>=1.12"]

[project.scripts]
bam-belt-sim = "bam_belt_sim.__main__:main"

[tool.uv.sources]
# WHY: the facility model's F1 line_sim is the independent oracle for the constant-speed case (tests/test_oracle.py).
bam-facility-model = { path = "../bam_facility_model", editable = true }
# WHY through src/external (bam_fivebar's pattern): viser-3d-viewer is its own repo, linked into src/external.
viser-3d-viewer = { path = "../../external/viser_3d_viewer", editable = true }

[dependency-groups]
dev = ["bam-facility-model", "pytest>=8", "scipy>=1.12", "matplotlib>=3.8", "imageio[ffmpeg]>=2.34", "viser-3d-viewer"]

[tool.hatch.build.targets.wheel]
packages = ["bam_belt_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
