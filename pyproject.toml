[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belt-sim"
version = "0.2.0"
description = "Fast headless 2D sim of a conveyor line with Cartesian pick gantries: belt speed control and pick scheduling ladders, scored in successful picks/min and value/min against an LP bound. Rerun replays, W&B ladders, matplotlib and Viser previews."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# WHY numpy only at runtime: the sim is the fast headless rung; it must run thousands of episodes in a ladder sweep.
# The LP bound, the viewers and the trackers are extras so the core imports anywhere.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
bound = ["scipy>=1.12"]
viz = ["matplotlib>=3.8", "imageio[ffmpeg]>=2.34"]
viser = ["viser==1.1.1"]
rerun = ["rerun-sdk>=0.22"]
wandb = ["wandb>=0.18"]
all = ["belt-sim[bound,viz,viser,rerun,wandb]"]

[project.scripts]
belt-sim = "belt_sim.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "scipy>=1.12", "matplotlib>=3.8", "imageio[ffmpeg]>=2.34", "viser==1.1.1", "rerun-sdk>=0.22",
       "wandb>=0.18", "pillow>=10"]

[tool.hatch.build.targets.wheel]
packages = ["belt_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
